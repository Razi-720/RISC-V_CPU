<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="820" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle" font-family="Arial, sans-serif">
    Cocotb Verification Environment
  </text>
  
  <!-- Main Container -->
  <rect x="50" y="80" width="1100" height="140" fill="#e8f4f8" stroke="#3498db" stroke-width="3" rx="10"/>
  <text x="600" y="110" font-size="20" font-weight="bold" fill="#2c3e50" text-anchor="middle" font-family="Arial, sans-serif">
    Cocotb Testbench Layer
  </text>
  
  <!-- Three boxes in top layer - evenly spaced -->
  <!-- Test Sequences -->
  <rect x="100" y="130" width="280" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="240" y="155" font-size="16" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Test Sequences
  </text>
  <text x="240" y="178" font-size="13" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    (test_*.py)
  </text>
  <text x="240" y="195" font-size="11" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    Test case generation &amp; control
  </text>
  
  <!-- Scoreboard -->
  <rect x="460" y="130" width="280" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="600" y="155" font-size="16" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Scoreboard
  </text>
  <text x="600" y="178" font-size="13" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    (scoreboard.py)
  </text>
  <text x="600" y="195" font-size="11" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    Result validation &amp; checking
  </text>
  
  <!-- Coverage Collector -->
  <rect x="820" y="130" width="280" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="960" y="155" font-size="16" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Coverage Collector
  </text>
  <text x="960" y="178" font-size="13" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    (coverage.py)
  </text>
  <text x="960" y="195" font-size="11" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    Functional coverage metrics
  </text>
  
  <!-- Arrows from top layer to middle components -->
  <line x1="240" y1="200" x2="240" y2="270" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="200" x2="600" y2="270" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="960" y1="200" x2="960" y2="270" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Middle Layer Components - aligned with top boxes -->
  <!-- Driver -->
  <rect x="100" y="270" width="280" height="100" fill="#27ae60" stroke="#229954" stroke-width="2" rx="8"/>
  <text x="240" y="298" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Driver
  </text>
  <text x="240" y="320" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Instruction generation
  </text>
  <text x="240" y="338" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Stimulus patterns
  </text>
  <text x="240" y="356" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Memory initialization
  </text>
  
  <!-- Monitor -->
  <rect x="460" y="270" width="280" height="100" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="8"/>
  <text x="600" y="298" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Monitor
  </text>
  <text x="600" y="320" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Output observation
  </text>
  <text x="600" y="338" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Transaction capture
  </text>
  <text x="600" y="356" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • State monitoring
  </text>
  
  <!-- Reference Model -->
  <rect x="820" y="270" width="280" height="100" fill="#16a085" stroke="#138d75" stroke-width="2" rx="8"/>
  <text x="960" y="298" font-size="18" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Reference Model
  </text>
  <text x="960" y="320" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • ISA-compliant simulator
  </text>
  <text x="960" y="338" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Expected results
  </text>
  <text x="960" y="356" font-size="12" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    • Golden model (Python)
  </text>
  
  <!-- Arrows from middle to interface -->
  <line x1="240" y1="370" x2="240" y2="420" stroke="#34495e" stroke-width="3"/>
  <line x1="600" y1="370" x2="600" y2="420" stroke="#34495e" stroke-width="3"/>
  <line x1="960" y1="370" x2="960" y2="420" stroke="#34495e" stroke-width="3"/>
  
  <!-- Connection lines merging to center -->
  <line x1="240" y1="420" x2="600" y2="470" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="420" x2="600" y2="470" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="960" y1="420" x2="600" y2="470" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Interface/Bus Layer -->
  <rect x="250" y="470" width="700" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="600" y="500" font-size="16" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    Verification Interface (Cocotb Signals)
  </text>
  
  <!-- Arrow to DUT -->
  <line x1="600" y1="520" x2="600" y2="570" stroke="#34495e" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- DUT Box - centered -->
  <rect x="275" y="570" width="650" height="150" fill="#2c3e50" stroke="#1a252f" stroke-width="3" rx="10"/>
  <text x="600" y="605" font-size="24" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">
    DUT: RV32I Pipelined Processor
  </text>
  <text x="600" y="635" font-size="14" fill="#ecf0f1" text-anchor="middle" font-family="Arial, sans-serif">
    (Verilog RTL - Synthesizable Design)
  </text>
  <text x="600" y="665" font-size="13" fill="#bdc3c7" text-anchor="middle" font-family="Arial, sans-serif">
    IF → ID → EX → MEM → WB Pipeline Stages
  </text>
  <text x="600" y="690" font-size="13" fill="#bdc3c7" text-anchor="middle" font-family="Arial, sans-serif">
    Hazard Detection | Forwarding | Branch Prediction
  </text>
  
  <!-- Feedback arrows -->
  <path d="M 925 645 L 1010 645 L 1010 510 L 950 510" fill="none" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead-red)"/>
  <text x="1030" y="575" font-size="13" fill="#e74c3c" font-weight="bold" font-family="Arial, sans-serif">
    Outputs to
  </text>
  <text x="1030" y="595" font-size="13" fill="#e74c3c" font-weight="bold" font-family="Arial, sans-serif">
    Monitor
  </text>
  
  <path d="M 275 645 L 190 645 L 190 510 L 250 510" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead-green)"/>
  <text x="70" y="575" font-size="13" fill="#27ae60" font-weight="bold" font-family="Arial, sans-serif">
    Inputs from
  </text>
  <text x="70" y="595" font-size="13" fill="#27ae60" font-weight="bold" font-family="Arial, sans-serif">
    Driver
  </text>
  
  <!-- Legend -->
  <rect x="50" y="745" width="1100" height="50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="600" y="772" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle" font-family="Arial, sans-serif">
    ⚙️ Simulation Environment: IIC-OSIC-TOOLS | Verilator + Cocotb | VCD Waveform Dumping | GTKWave Viewer
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
</svg>